name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# A dispatch that pushes its own tag must not start a second publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # Skip the follow-up tag run from the automated version-bump commit.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            NEW_VERSION="${TAG#v}"
            if [[ ! "${NEW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must be vMAJOR.MINOR.PATCH, got: ${TAG}"
              exit 1
            fi
            echo "source=tag" >> "${GITHUB_OUTPUT}"
          else
            CURRENT_VERSION=$(grep '^readonly VERSION=' blastshield | cut -d'"' -f2)
            echo "Current script version: ${CURRENT_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "source=dispatch" >> "${GITHUB_OUTPUT}"
          fi
          echo "new_version=${NEW_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${NEW_VERSION}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Skip if GitHub release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists; skipping publish."
            echo "already_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update blastshield script version
        if: steps.existing.outputs.already_exists != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          perl -pi -e 's/^readonly VERSION=".*"/readonly VERSION="$ENV{NEW_VERSION}"/' blastshield

      - name: Package release
        if: steps.existing.outputs.already_exists != 'true'
        run: |
          python3 scripts/package-release.py

      - name: Compute SHA256 of tarball
        if: steps.existing.outputs.already_exists != 'true'
        id: sha
        shell: bash
        run: |
          TARBALL=$(ls dist/*.tar.gz | head -n1)
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"
          SHA256=$(python3 -c "import hashlib; print(hashlib.sha256(open('${TARBALL}','rb').read()).hexdigest())")
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "release_url=https://github.com/cdrxyz/blastshield/releases/download/v${{ steps.version.outputs.new_version }}/blastshield-${{ steps.version.outputs.new_version }}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump
        if: steps.existing.outputs.already_exists != 'true' && steps.version.outputs.source == 'dispatch'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add blastshield
          git commit -m "chore: release v${NEW_VERSION}" -m "[skip ci] [skip release]"

      - name: Push commit
        if: steps.existing.outputs.already_exists != 'true' && steps.version.outputs.source == 'dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create and push tag
        if: steps.existing.outputs.already_exists != 'true' && steps.version.outputs.source == 'dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        if: steps.existing.outputs.already_exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: BlastShield v${{ steps.version.outputs.new_version }}
          body: |
            Release v${{ steps.version.outputs.new_version }} from commit ${{ github.sha }}.
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch Homebrew tap update
        if: steps.existing.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.new_version }}
          RELEASE_URL: ${{ steps.sha.outputs.release_url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_REPO_TOKEN is not configured."
            exit 1
          fi
          gh workflow run update-formula.yml \
            --repo cdrxyz/homebrew-tap \
            --ref master \
            -f formula=blastshield \
            -f version="$VERSION" \
            -f url="$RELEASE_URL" \
            -f sha256="$SHA256"
